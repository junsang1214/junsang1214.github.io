<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 주요 지표</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 30px; }
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; color: #2c3e50; font-size: 18px; margin-bottom: 15px;}
    .full-width { grid-column: 1 / -1; }
    .poll-source { text-align: right; font-size: 12px; color: #888; margin-top: 10px; }
    @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <h1>📊 실시간 주요 지표</h1>

  <div class="grid-container">
    
    <!-- 1층: 경제 지표 (코스피, 환율) -->
    <div class="card">
      <h3>코스피 (KOSPI)</h3>
      <div id="kospi-number" style="margin-top: 5px; margin-bottom: 15px; font-family: sans-serif;">구글 시트 데이터 로딩 중...</div>
      <img id="kospi-chart" src="https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png" alt="실시간 코스피 차트" style="width: 100%; border-radius: 4px;">
      <div class="poll-source">* 구글 파이낸스 연동 (서버 차단 없음)</div>
    </div>

    <div class="card">
      <h3>환율 (USD/KRW)</h3>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
        "symbol": "FX_IDC:USDKRW",
        "width": "100%",
        "height": "220",
        "locale": "kr",
        "dateRange": "1M",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": false,
        "largeChartUrl": ""
        }
        </script>
      </div>
    </div>

    <!-- 2층: 대통령 국정 지지율 그래프 -->
    <div class="card full-width">
      <h3>📈 대통령 국정 지지율 추이</h3>
      <div style="height: 300px; width: 100%;">
        <canvas id="poll-chart-president"></canvas>
      </div>
      <div class="poll-source">* 구글 스프레드시트 연동 (B열, C열)</div>
    </div>

    <!-- 3층: 정당 지지율 그래프 -->
    <div class="card full-width">
      <h3>📈 주요 정당 지지율 추이</h3>
      <div style="height: 300px; width: 100%;">
        <canvas id="poll-chart-party"></canvas>
      </div>
      <div class="poll-source">* 구글 스프레드시트 연동 (D열, E열)</div>
    </div>

    <!-- 4층: 뉴스 게시판 (한국갤럽, 리얼미터) -->
    <div class="card">
      <h3>📰 한국갤럽 지지율 뉴스</h3>
      <div style="margin-top: 15px; font-size: 14px; color: #555;">
        <ul id="news-list-gallup" style="list-style-type: disc; padding-left: 20px; line-height: 1.8;">
          <li>뉴스 불러오는 중...</li>
        </ul>
      </div>
    </div>

    <div class="card">
      <h3>📰 리얼미터 지지율 뉴스</h3>
      <div style="margin-top: 15px; font-size: 14px; color: #555;">
        <ul id="news-list-realmeter" style="list-style-type: disc; padding-left: 20px; line-height: 1.8;">
          <li>뉴스 불러오는 중...</li>
        </ul>
      </div>
    </div>

  </div>

  <script>
    // 1. 코스피 차트 이미지만 실시간으로 갱신 (이미지는 네이버가 차단하지 않음)
    setInterval(function() {
      document.getElementById('kospi-chart').src = 'https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png?' + Date.now();
    }, 30000);

    // 2. 구글 뉴스 가져오기
    function fetchNews(keyword, elementId) {
      const rssUrl = 'https://news.google.com/rss/search?q=' + encodeURIComponent(keyword) + '&hl=ko&gl=KR&ceid=KR:ko';
      const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);

      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'ok') {
            const items = data.items.slice(0, 5); 
            let newsHtml = '';
            items.forEach(item => {
              newsHtml += `<li><a href="${item.link}" target="_blank" style="color: #2c3e50; text-decoration: none;">${item.title}</a></li>`;
            });
            document.getElementById(elementId).innerHTML = newsHtml;
          }
        })
        .catch(err => console.log("뉴스 로딩 지연"));
    }

    fetchNews('한국갤럽 지지율', 'news-list-gallup');
    fetchNews('리얼미터 지지율', 'news-list-realmeter');

    // 3. 만능 구글 시트 연동 (그래프 + 코스피 수치 동시에 가져오기)
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcrpXqyXnwBL7AJ7K51EtGS64VAVHzPGswF-dCXE9LVMFSZZS040xdhkrqkyrccJs1LbGYRvetNIgm/pub?output=csv';
    
    fetch(sheetUrl + '&nocache=' + Date.now())
      .then(res => res.text())
      .then(csv => {
        const rows = csv.split('\n').filter(row => row.trim() !== '');
        const labels = [];
        const posData = []; 
        const negData = []; 
        const partyAData = []; 
        const partyBData = []; 

        rows.forEach((row, index) => {
          // 쉼표(,)가 포함된 숫자 등 CSV 에러 방지를 위한 텍스트 분리 정규식
          const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          
          if (index === 0) { 
            // 구글 시트 1번째 줄의 F1(6번째), G1(7번째) 칸에서 코스피 숫자를 읽어옵니다.
            if (cols.length >= 7 && cols[5].trim() !== '') {
              // 따옴표나 쉼표 등 불순물 제거
              const cleanPrice = cols[5].replace(/"/g, '').replace(/,/g, '').trim();
              const cleanChange = cols[6].replace(/"/g, '').replace(/,/g, '').trim();
              
              const kospiPrice = parseFloat(cleanPrice).toFixed(2);
              const kospiChange = parseFloat(cleanChange).toFixed(2);

              if (!isNaN(kospiPrice)) {
                let color = '#333';
                let sign = '';
                if (kospiChange > 0) { color = '#d32f2f'; sign = '+'; }
                else if (kospiChange < 0) { color = '#1976d2'; }

                document.getElementById('kospi-number').innerHTML = 
                  `<span style="font-size: 28px; font-weight: bold; color: ${color};">${kospiPrice}</span> 
                   <span style="font-size: 15px; color: ${color}; margin-left: 8px;">(${sign}${kospiChange}%)</span>`;
              }
            } else {
              document.getElementById('kospi-number').innerHTML = `<span style="font-size: 14px; color: #d32f2f;">구글 시트 F1, G1 칸에 수식을 넣어주세요.</span>`;
            }
            return; 
          }
          
          if (cols.length >= 3) {
            labels.push(cols[0].replace(/"/g, '').trim()); 
            posData.push(parseFloat(cols[1].replace(/"/g, '').trim())); 
            negData.push(parseFloat(cols[2].replace(/"/g, '').trim())); 
          }
          if (cols.length >= 5) {
            partyAData.push(parseFloat(cols[3].replace(/"/g, '').trim())); 
            partyBData.push(parseFloat(cols[4].replace(/"/g, '').trim())); 
          }
        });

        // 그래프 렌더링
        const ctxPresident = document.getElementById('poll-chart-president').getContext('2d');
        new Chart(ctxPresident, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              { label: '긍정 평가 (%)', data: posData, borderColor: '#1976d2', backgroundColor: 'rgba(25, 118, 210, 0.1)', borderWidth: 2, pointBackgroundColor: '#1976d2', tension: 0.3, fill: true }, 
              { label: '부정 평가 (%)', data: negData, borderColor: '#d32f2f', backgroundColor: 'rgba(211, 47, 47, 0.1)', borderWidth: 2, pointBackgroundColor: '#d32f2f', tension: 0.3, fill: true } 
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { position: 'bottom' } } }
        });

        const ctxParty = document.getElementById('poll-chart-party').getContext('2d');
        new Chart(ctxParty, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              { label: '더불어민주당 (%)', data: partyBData, borderColor: '#004ea2', backgroundColor: 'rgba(0, 78, 162, 0.1)', borderWidth: 2, pointBackgroundColor: '#004ea2', tension: 0.3, fill: true }, 
              { label: '국민의힘 (%)', data: partyAData, borderColor: '#e61e2b', backgroundColor: 'rgba(230, 30, 43, 0.1)', borderWidth: 2, pointBackgroundColor: '#e61e2b', tension: 0.3, fill: true } 
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { position: 'bottom' } } }
        });

      })
      .catch(err => console.log("데이터를 불러오는 데 실패했습니다."));
  </script>
</body>
</html>
