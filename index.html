<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 주요 지표</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 30px; }
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; color: #2c3e50; font-size: 18px; margin-bottom: 15px;}
    .full-width { grid-column: 1 / -1; }
    .poll-source { text-align: right; font-size: 12px; color: #888; margin-top: 10px; }
    
    .dday-card { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; text-align: center; }
    .dday-card h3 { color: white; margin-bottom: 5px; }
    
    .insight-card { border-left: 6px solid #ffca28; background-color: #fffdf5; }
    #insight-input { width: 100%; height: 80px; margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; resize: none; font-family: inherit; font-size: 14px; box-sizing: border-box; background-color: white;}
    #save-btn { margin-top: 10px; padding: 8px 15px; background: #ffca28; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #333; }
    #save-btn:hover { background: #ffc107; }
    
    @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <h1>📊 실시간 주요 지표</h1>

  <div class="grid-container">
    
    <!-- 1층: D-Day 카운터 및 주간 인사이트 -->
    <div class="card dday-card">
      <h3>🗳️ 다음 대통령 선거</h3>
      <div id="dday-counter" style="font-size: 32px; font-weight: bold; margin: 10px 0;">계산 중...</div>
      <div style="font-size: 13px; opacity: 0.8;">제21대 대선 (2027년 3월 3일)</div>
    </div>

    <div class="card insight-card">
      <h3>💡 나의 주간 인사이트</h3>
      <textarea id="insight-input" placeholder="메모를 불러오는 중..."></textarea>
      <div>
        <button id="save-btn" onclick="saveInsight()">서버에 동기화</button>
        <span id="save-msg" style="margin-left: 10px; font-size: 13px; color: #d32f2f; font-weight: bold;"></span>
      </div>
    </div>

    <!-- 2층: 경제 지표 -->
    <div class="card">
      <h3>코스피 (KOSPI)</h3>
      <div id="kospi-number" style="margin-top: 5px; margin-bottom: 15px; font-family: sans-serif;">구글 시트 데이터 로딩 중...</div>
      <img id="kospi-chart" src="https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png" alt="실시간 코스피 차트" style="width: 100%; border-radius: 4px;">
      <div class="poll-source">* 구글 파이낸스 연동</div>
    </div>

    <div class="card">
      <h3>환율 (USD/KRW)</h3>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        { "symbol": "FX_IDC:USDKRW", "width": "100%", "height": "220", "locale": "kr", "dateRange": "1M", "colorTheme": "light", "isTransparent": true, "autosize": false, "largeChartUrl": "" }
        </script>
      </div>
    </div>

    <!-- 3층, 4층, 5층: 그래프 및 뉴스 -->
    <div class="card full-width">
      <h3>📈 대통령 국정 지지율 추이</h3>
      <div style="height: 300px; width: 100%;"><canvas id="poll-chart-president"></canvas></div>
    </div>

    <div class="card full-width">
      <h3>📈 주요 정당 지지율 추이</h3>
      <div style="height: 300px; width: 100%;"><canvas id="poll-chart-party"></canvas></div>
    </div>

    <div class="card">
      <h3>📰 한국갤럽 지지율 뉴스</h3>
      <div style="margin-top: 15px; font-size: 14px; color: #555;">
        <ul id="news-list-gallup" style="list-style-type: disc; padding-left: 20px; line-height: 1.8;"><li>뉴스 로딩 중...</li></ul>
      </div>
    </div>

    <div class="card">
      <h3>📰 리얼미터 지지율 뉴스</h3>
      <div style="margin-top: 15px; font-size: 14px; color: #555;">
        <ul id="news-list-realmeter" style="list-style-type: disc; padding-left: 20px; line-height: 1.8;"><li>뉴스 로딩 중...</li></ul>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 🚨 여기에 2단계에서 복사한 '웹 앱 URL'을 붙여넣으세요! (따옴표 안에)
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzIqIdWtcHPyoP22XYunAZdr4bl-p1OQgxbBc5D0F7yH6Fx7-dwY4sLr7PkX_hvOkI7/exec";
    // ==========================================

    const insightBox = document.getElementById('insight-input');
    const msg = document.getElementById('save-msg');

    // 홈페이지 열릴 때 서버(구글 시트)에서 메모 불러오기
    fetch(GAS_URL)
      .then(res => res.text())
      .then(text => {
        insightBox.value = text;
        insightBox.placeholder = "여기에 메모를 입력하세요...";
      })
      .catch(err => { insightBox.placeholder = "연결 지연..."; });

    // 저장 버튼 누르면 서버(구글 시트)로 메모 보내기
    function saveInsight() {
      msg.innerText = "저장 중...";
      fetch(GAS_URL + '?action=save&memo=' + encodeURIComponent(insightBox.value))
        .then(res => res.text())
        .then(text => {
          msg.innerText = "서버 동기화 완료!";
          setTimeout(() => { msg.innerText = ""; }, 2000);
        })
        .catch(err => { msg.innerText = "저장 실패"; });
    }

    // 1. D-Day 카운터
    function calculateDday() {
      const dday = new Date("2027-03-03T00:00:00+09:00");
      const today = new Date();
      const gap = dday.getTime() - today.getTime();
      const days = Math.ceil(gap / (1000 * 60 * 60 * 24));
      let ddayText = days > 0 ? `D - ${days}` : (days === 0 ? "D - Day" : `D + ${Math.abs(days)}`);
      document.getElementById('dday-counter').innerText = ddayText;
    }
    calculateDday();

    // 2. 코스피 차트 갱신
    setInterval(function() { document.getElementById('kospi-chart').src = 'https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png?' + Date.now(); }, 30000);

    // 3. 구글 뉴스
    function fetchNews(keyword, elementId) {
      const rssUrl = 'https://news.google.com/rss/search?q=' + encodeURIComponent(keyword) + '&hl=ko&gl=KR&ceid=KR:ko';
      fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl))
        .then(res => res.json())
        .then(data => {
          if (data.status === 'ok') {
            let newsHtml = '';
            data.items.slice(0, 5).forEach(item => {
              newsHtml += `<li><a href="${item.link}" target="_blank" style="color: #2c3e50; text-decoration: none;">${item.title}</a></li>`;
            });
            document.getElementById(elementId).innerHTML = newsHtml;
          }
        });
    }
    fetchNews('한국갤럽 지지율', 'news-list-gallup');
    fetchNews('리얼미터 지지율', 'news-list-realmeter');

    // 4. 구글 시트 데이터 (코스피 + 그래프)
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcrpXqyXnwBL7AJ7K51EtGS64VAVHzPGswF-dCXE9LVMFSZZS040xdhkrqkyrccJs1LbGYRvetNIgm/pub?output=csv';
    fetch(sheetUrl + '&nocache=' + Date.now())
      .then(res => res.text())
      .then(csv => {
        const rows = csv.split('\n').filter(row => row.trim() !== '');
        const labels = [], posData = [], negData = [], partyAData = [], partyBData = []; 

        rows.forEach((row, index) => {
          const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
          
          if (index === 0) { 
            if (cols.length >= 7 && cols[5].trim() !== '') {
              const cleanPrice = cols[5].replace(/"/g, '').replace(/,/g, '').trim();
              const cleanChange = cols[6].replace(/"/g, '').replace(/,/g, '').trim();
              const kospiPrice = parseFloat(cleanPrice).toFixed(2);
              const kospiChange = parseFloat(cleanChange).toFixed(2);

              if (!isNaN(kospiPrice)) {
                let color = '#333'; let sign = '';
                if (kospiChange > 0) { color = '#d32f2f'; sign = '+'; }
                else if (kospiChange < 0) { color = '#1976d2'; }
                document.getElementById('kospi-number').innerHTML = 
                  `<span style="font-size: 28px; font-weight: bold; color: ${color};">${kospiPrice}</span> 
                   <span style="font-size: 15px; color: ${color}; margin-left: 8px;">(${sign}${kospiChange}%)</span>`;
              }
            }
            return; 
          }

          if (cols.length >= 3) {
            labels.push(cols[0].replace(/"/g, '').trim()); 
            posData.push(parseFloat(cols[1].replace(/"/g, '').trim())); 
            negData.push(parseFloat(cols[2].replace(/"/g, '').trim())); 
          }
          if (cols.length >= 5) {
            partyAData.push(parseFloat(cols[3].replace(/"/g, '').trim())); 
            partyBData.push(parseFloat(cols[4].replace(/"/g, '').trim())); 
          }
        });

        new Chart(document.getElementById('poll-chart-president').getContext('2d'), {
          type: 'line',
          data: { labels: labels, datasets: [
            { label: '긍정 평가 (%)', data: posData, borderColor: '#1976d2', backgroundColor: 'rgba(25, 118, 210, 0.1)', borderWidth: 2, pointBackgroundColor: '#1976d2', tension: 0.3, fill: true }, 
            { label: '부정 평가 (%)', data: negData, borderColor: '#d32f2f', backgroundColor: 'rgba(211, 47, 47, 0.1)', borderWidth: 2, pointBackgroundColor: '#d32f2f', tension: 0.3, fill: true } 
          ]},
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { position: 'bottom' } } }
        });

        new Chart(document.getElementById('poll-chart-party').getContext('2d'), {
          type: 'line',
          data: { labels: labels, datasets: [
            { label: '더불어민주당 (%)', data: partyBData, borderColor: '#004ea2', backgroundColor: 'rgba(0, 78, 162, 0.1)', borderWidth: 2, pointBackgroundColor: '#004ea2', tension: 0.3, fill: true }, 
            { label: '국민의힘 (%)', data: partyAData, borderColor: '#e61e2b', backgroundColor: 'rgba(230, 30, 43, 0.1)', borderWidth: 2, pointBackgroundColor: '#e61e2b', tension: 0.3, fill: true } 
          ]},
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { position: 'bottom' } } }
        });
      });
  </script>
</body>
</html>
